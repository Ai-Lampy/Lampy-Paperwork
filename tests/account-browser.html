<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Lampy account storage browser checks</title>
<h1>Account storage browser checks</h1><pre id="results">Ready</pre>
<script src="../js/project-core.js"></script>
<script src="../js/account-project-store.js"></script>
<script src="../js/project-transfer.js"></script>
<script>
window.runAccountBrowserChecks=async function(){
 const assert=(condition,message)=>{if(!condition)throw Error(message)};
 const name='lampy-v59-browser-test-'+crypto.randomUUID(),a=await LampyProjectStore.open({name}),b=await LampyProjectStore.open({name});
 const passed=[],owner='browser-test';
 try{
  const payload=LampyProjectTransfer.empty();payload.app.projectInfo.file.projectName='Safari test';
  payload.app.gdtfFiles={imported:{base64:'preserved-full-payload'}};
  const first=await a.create({owner,name:'Project A',payload}),second=await a.create({owner,name:'Project B',payload});
  assert((await b.read(owner,'project',first.id)).name==='Project A','Second connection cannot read committed data');passed.push('Committed records visible across connections');
  const [editA,editB]=await Promise.all([a.save({owner,id:first.id,expectedRevision:1,payload:{...payload,test:'A'}}),b.save({owner,id:first.id,expectedRevision:1,payload:{...payload,test:'B'}})]);
  assert(Number(editA.ok)+Number(editB.ok)===1,'Concurrent saves overwrite each other');assert((await a.recoveries(owner,'project',first.id)).length===1,'Losing edit was not preserved');passed.push('Atomic revision check and conflict recovery');
  assert((await a.read(owner,'project',second.id)).revision===1,'Another project was changed');passed.push('Different projects isolated');
  const pending=await a.beginSync(owner,'project',first.id);
  await a.save({owner,id:first.id,expectedRevision:2,payload:{...payload,test:'during-upload'}});
  const ack=await a.finishSync(owner,'project',first.id,{token:pending.lease.token,etag:'"remote"'});assert(ack.dirty&&ack.revision===3,'New edit lost during upload acknowledgement');passed.push('In-flight edits remain pending');
  a.close();b.close();const reopened=await LampyProjectStore.open({name});
  assert((await reopened.read(owner,'project',first.id)).payload.app.gdtfFiles.imported.base64==='preserved-full-payload','Complete payload lost on reopen');reopened.close();passed.push('Complete imported data survives close and reopen');
  document.getElementById('results').textContent=passed.join('\n');return {ok:true,passed,browser:navigator.userAgent};
 }finally{a.close();b.close();await new Promise((resolve,reject)=>{const r=indexedDB.deleteDatabase(name);r.onsuccess=resolve;r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error('Test database cleanup blocked'))})}
};
</script></html>
