name: Deploy Lampy Paperwork
run-name: Deploy Lampy Paperwork V${{ inputs.release_version }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Lampy version number to deploy (without the V)
        required: true
        type: string
      confirm_deploy:
        description: Deploy the current selected branch to the live GitHub Pages site
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == true }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v6

      - name: Verify release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          APP_VERSION="$(sed -n "s/^const VERSION='\([^']*\)';$/\1/p" index.html | head -n 1)"
          if [[ -z "$APP_VERSION" ]]; then
            echo "Could not read the Lampy version from index.html." >&2
            exit 1
          fi
          if [[ "$APP_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Release version V$RELEASE_VERSION does not match index.html V$APP_VERSION." >&2
            exit 1
          fi
          echo "Verified Lampy Paperwork V$APP_VERSION."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check release
        run: |
          node tests/display-regressions.cjs
          node tests/release-regressions.cjs
          node scripts/validate-release.cjs

      - name: Build and verify deployment artifact
        run: python3 scripts/build_site.py _site

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
